<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 — Error del Servidor</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .error-box { text-align: center; padding: 40px; }
        .error-code { font-size: 8rem; font-weight: 800; background: linear-gradient(135deg, #ef4444, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
        .error-msg { font-size: 1.2rem; color: rgba(255,255,255,0.5); margin: 16px 0 8px; }
        .error-sub { font-size: 0.85rem; color: rgba(255,255,255,0.35); margin-bottom: 32px; }
        .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .btn { padding: 12px 28px; border: none; border-radius: 12px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }
    </style>
</head>
<body>
    <div class="error-box">
        <div class="error-code">500</div>
        <div class="error-msg">Ocurrio un error en el servidor</div>
        <div class="error-sub">El problema quedo registrado. Intente de nuevo en unos momentos.</div>
        <div class="actions">
            <a href="javascript:location.reload()" class="btn btn-primary">Reintentar</a>
            <a href="/" class="btn btn-secondary">Volver al Inicio</a>
        </div>
    </div>
</body>
</html>
