<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargando - Personeros Chulucanas</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .loader-box {
            text-align: center;
            padding: 40px;
        }
        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(99,102,241,0.2);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-box h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 8px; }
        .loader-box p { font-size: 0.85rem; color: rgba(255,255,255,0.5); }
        .retry-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 24px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="loader-box">
        <div class="spinner"></div>
        <h2>Servidor activandose...</h2>
        <p>Esto toma unos segundos. Se recargara automaticamente.</p>
        <a href="javascript:location.reload()" class="retry-link">Reintentar</a>
    </div>
    <script>
        setTimeout(function() { location.reload(); }, 5000);
    </script>
</body>
</html>
