name: Keep Alive

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          for i in 1 2 3 4 5; do
            curl -sf https://personeros-app.onrender.com/ping || true
            sleep 20
          done
